function start(id,free=false){
let c=cats.find(x=>x.id===id);currentCat=c;entryCost=free?0:costFor(c);
if(save.picks<entryCost){shop();return}
if(!free)save.picks-=entryCost;persist();
let pool=qs.filter(x=>x.c===id&&(mode==='normal'?true:mode==='hard'?x.d>=2:true));
if(pool.length<4)pool=qs.filter(x=>x.c===id);
quiz=shuffle([...pool]).slice(0,Math.min(mode==='death'?6:5,pool.length));
qi=0;score=0;streak=0;answered=false;renderQ()
}
function renderQ(){
let q=quiz[qi],pct=(qi/quiz.length)*100;
$('screen').innerHTML=
`
<button class="back" onclick="home()">← Abandon run</button>
<div class="scene" style="
--scene-bg:${scenes[currentCat.id]}">

<div class="progressbar"><div class="progressfill" style="width:${pct}%"></div></div>
<div class="badge">${qi+1}/${quiz.length}</div><div class="badge">☠ ${score}
correct</div><div class="badge gold">🔥 ${streak} streak</div>
<h1 style="margin-top:14px">${q.q}</h1></div>
<div id="answers">${q.a.map((x,i)=>`<button class="answer" onclick="ans(${i})"><span
class="letter">${String.fromCharCode(65+i)}</span><span>${x}</span></button>`).join('')}</div
>
<div id="fact"></div>`
;
}
function ans(i){
if(answered)return;answered=true;let q=quiz[qi],btns=[...document.querySelectorAll('
.answer')];
btns[q.k].classList.add('correct');if(i!==q.k)btns[i].classList.add('wrong');
if(i===q.k){score++;streak++;save.picks+=mode==='hard'?2:1;save.xp+=5+(mode==='hard'?3:m
ode==='death'?5:0);if(streak>save.bestStreak)save.bestStreak=streak}else streak=0;
persist();
$('fact').innerHTML=
`<div class="fact"><div class="kicker">${i===q.k?'CORRECT — TRIBUTE
ACCEPTED':'WRONG — THE VOID LAUGHS'}</div><p>${q.f}</p><button class="primary"
onclick="nextQ()">${qi===quiz.length-1?'SEE RESULTS':'NEXT QUESTION'}</button></div>`
}
function nextQ(){if(qi===quiz.length-1)results();else{qi++;answered=false;renderQ()}}

let
perfect=score===quiz.length,cleared=score>=Math.ceil(quiz.length*
.6),bonus=perfect?6:cleared
?2:0;
save.picks+=bonus;if(cleared)save.wins++;if(perfect)save.perfect++;save.xp+=perfect?20:clear
ed?10:3;persist();
$('screen').innerHTML=
`<div class="scene center"
style="
--scene-bg:${scenes[currentCat.id]}"><div class="kicker">RITUAL COMPLETE</div><div
class="result">${score}/${quiz.length}</div>
<h1>${perfect?'Possessed by knowledge.
':cleared?'Respectably dangerous.
':'The abyss
remains unimpressed.
'}</h1>
<p>${bonus?`Completion bonus: <b>+${bonus} picks</b>
`
.
:''}Run XP added.
</p>
<button class="primary" onclick="start(currentCat.id)">RUN IT AGAIN</button><button
class="secondary" onclick="home()">BACK TO THE PIT</button></div>`
}
